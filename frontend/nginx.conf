# Serves the built web apps and forwards API, webhook and branding requests to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # knowledge-base uploads are capped at 10 MB by the backend
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /        { try_files /ui/chat.html =404; }
    location = /admin   { try_files /ui/admin.html =404; }
    location = /admin/  { try_files /ui/admin.html =404; }
    location = /widget.js {
        add_header Cache-Control "public, max-age=300";
        try_files /ui/widget.js =404;
    }
    location /ui/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /ui/ { try_files $uri =404; }

    location ~ ^/(api|webhooks|branding)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # chat replies stream as server-sent events
        proxy_read_timeout 300s;
    }
}
