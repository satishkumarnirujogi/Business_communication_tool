[project]
name = "clinic-assistant"
version = "0.6.0"
description = "Self-hostable AI front-desk assistant for small clinics"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Pinned exactly: LiteLLM had compromised PyPI releases (1.82.7/1.82.8) in March 2026.
    # Bump deliberately after checking the release notes.
    "litellm==1.110.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "gspread>=6.1",
    # knowledge base
    "chromadb>=1.0",
    "fastembed>=0.7",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.6", "mypy==2.4.1", "types-PyYAML"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",    # FastAPI's Depends()/File() in argument defaults is the documented pattern
    "SIM105",  # explicit try/except/pass reads clearer than contextlib.suppress in a few places
]

[tool.ruff.lint.per-file-ignores]
"app/agent/language.py" = ["E501"]    # word lists
"app/knowledge/service.py" = ["E501"]  # stop-word list
"tests/*" = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
